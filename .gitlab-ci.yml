stages:
  - scan
  - image

variables:
  GIT_STRATEGY: fetch
  ARTIFACT_DIR: artifacts/security
  IMAGE_ENABLED: "false"
  IMAGE_BUILD_CONTEXT: "."
  DOCKERFILE_PATH: "Dockerfile"
  TRIVY_VERSION: "0.69.3"
  TRIVY_TIMEOUT: "10m"
  TRIVY_REPORT_SEVERITIES: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
  TRIVY_FAIL_SEVERITIES: "CRITICAL"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH'

.base_job: &base_job
  before_script:
    - apk add --no-cache bash ca-certificates coreutils curl gzip tar
    - |
      set -euo pipefail

      mkdir -p "$ARTIFACT_DIR"

      PROJECT_NAME="${DEPENDENCY_TRACK_PROJECT_NAME:-$CI_PROJECT_NAME}"
      PROJECT_VERSION="${CI_COMMIT_SHA}"
      PROJECT_UUID="${DEPENDENCY_TRACK_PROJECT_UUID:-}"
      IMAGE_PROJECT_NAME="${DEPENDENCY_TRACK_IMAGE_PROJECT_NAME:-${PROJECT_NAME}-image}"
      IMAGE_PROJECT_UUID="${DEPENDENCY_TRACK_IMAGE_PROJECT_UUID:-}"
      EFFECTIVE_IMAGE_TAG="${IMAGE_TAG:-$CI_COMMIT_SHA}"

      export PROJECT_NAME PROJECT_VERSION PROJECT_UUID IMAGE_PROJECT_NAME IMAGE_PROJECT_UUID EFFECTIVE_IMAGE_TAG
      export LOCAL_IMAGE_REF="${IMAGE_NAME:-}:${EFFECTIVE_IMAGE_TAG}"

      TRIVY_ARCHIVE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      TRIVY_BASE_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

      curl -fsSLO "${TRIVY_BASE_URL}/${TRIVY_ARCHIVE}"
      curl -fsSLO "${TRIVY_BASE_URL}/trivy_${TRIVY_VERSION}_checksums.txt"
      grep " ${TRIVY_ARCHIVE}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
      tar -xzf "${TRIVY_ARCHIVE}" trivy
      install -m 0755 trivy /usr/local/bin/trivy
      trivy version

      is_authoritative_run() {
        if [ "${CI_PIPELINE_SOURCE}" = "schedule" ]; then
          return 0
        fi
        if [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ]; then
          return 0
        fi
        return 1
      }

      upload_bom() {
        local project_uuid="$1"
        local project_name="$2"
        local bom_path="$3"

        if ! is_authoritative_run; then
          echo "Skipping Dependency-Track upload for non-authoritative pipeline."
          return 0
        fi

        if [ -z "${DEPENDENCY_TRACK_URL:-}" ] || [ -z "${DEPENDENCY_TRACK_API_KEY:-}" ]; then
          echo "DEPENDENCY_TRACK_URL and DEPENDENCY_TRACK_API_KEY are required for default-branch and scheduled uploads." >&2
          return 1
        fi

        if [ -n "${project_uuid}" ]; then
          curl --fail --silent --show-error \
            -X POST "${DEPENDENCY_TRACK_URL%/}/api/v1/bom" \
            -H "X-Api-Key: ${DEPENDENCY_TRACK_API_KEY}" \
            -F "project=${project_uuid}" \
            -F "projectVersion=${PROJECT_VERSION}" \
            -F "bom=@${bom_path}"

          echo
          echo "Uploaded ${bom_path} to Dependency-Track project UUID ${project_uuid}:${PROJECT_VERSION}"
          return 0
        fi

        curl --fail --silent --show-error \
          -X POST "${DEPENDENCY_TRACK_URL%/}/api/v1/bom" \
          -H "X-Api-Key: ${DEPENDENCY_TRACK_API_KEY}" \
          -F "autoCreate=true" \
          -F "projectName=${project_name}" \
          -F "projectVersion=${PROJECT_VERSION}" \
          -F "bom=@${bom_path}"

        echo
        echo "Uploaded ${bom_path} to Dependency-Track project ${project_name}:${PROJECT_VERSION} via auto-create fallback"
      }

repo_scan:
  stage: scan
  image: alpine:3.20
  extends: .base_job
  script:
    - |
      set -euo pipefail

      trivy fs \
        --no-progress \
        --timeout "${TRIVY_TIMEOUT}" \
        --format cyclonedx \
        --output "${ARTIFACT_DIR}/app-sbom.cdx.json" \
        .

      trivy fs \
        --no-progress \
        --timeout "${TRIVY_TIMEOUT}" \
        --scanners vuln \
        --severity "${TRIVY_REPORT_SEVERITIES}" \
        --format json \
        --output "${ARTIFACT_DIR}/repo-vulns.json" \
        .

      upload_bom "${PROJECT_UUID}" "${PROJECT_NAME}" "${ARTIFACT_DIR}/app-sbom.cdx.json"

      gate_status=0
      trivy fs \
        --no-progress \
        --timeout "${TRIVY_TIMEOUT}" \
        --scanners vuln \
        --severity "${TRIVY_FAIL_SEVERITIES}" \
        --exit-code 1 \
        --format table \
        . | tee "${ARTIFACT_DIR}/repo-gate.txt" || gate_status=$?

      exit "${gate_status}"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/security/app-sbom.cdx.json
      - artifacts/security/repo-vulns.json
      - artifacts/security/repo-gate.txt

image_scan:
  stage: image
  image: docker:27.1.1-cli
  services:
    - name: docker:27.1.1-dind
      command:
        - --tls=false
  extends: .base_job
  rules:
    - if: '$IMAGE_ENABLED == "true"'
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - |
      set -euo pipefail

      if [ -z "${IMAGE_NAME:-}" ]; then
        echo "IMAGE_NAME is required when IMAGE_ENABLED=true." >&2
        exit 1
      fi

      docker info >/dev/null

      docker build \
        --iidfile "${ARTIFACT_DIR}/image.iid" \
        -f "${DOCKERFILE_PATH}" \
        -t "${LOCAL_IMAGE_REF}" \
        "${IMAGE_BUILD_CONTEXT}"

      docker image inspect "${LOCAL_IMAGE_REF}" --format '{{.Id}}' | tee "${ARTIFACT_DIR}/image-id.txt"

      trivy image \
        --no-progress \
        --timeout "${TRIVY_TIMEOUT}" \
        --format cyclonedx \
        --output "${ARTIFACT_DIR}/image-sbom.cdx.json" \
        "${LOCAL_IMAGE_REF}"

      trivy image \
        --no-progress \
        --timeout "${TRIVY_TIMEOUT}" \
        --scanners vuln \
        --severity "${TRIVY_REPORT_SEVERITIES}" \
        --format json \
        --output "${ARTIFACT_DIR}/image-vulns.json" \
        "${LOCAL_IMAGE_REF}"

      upload_bom "${IMAGE_PROJECT_UUID}" "${IMAGE_PROJECT_NAME}" "${ARTIFACT_DIR}/image-sbom.cdx.json"

      gate_status=0
      trivy image \
        --no-progress \
        --timeout "${TRIVY_TIMEOUT}" \
        --scanners vuln \
        --severity "${TRIVY_FAIL_SEVERITIES}" \
        --exit-code 1 \
        --format table \
        "${LOCAL_IMAGE_REF}" | tee "${ARTIFACT_DIR}/image-gate.txt" || gate_status=$?

      exit "${gate_status}"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/security/image-sbom.cdx.json
      - artifacts/security/image-vulns.json
      - artifacts/security/image-gate.txt
      - artifacts/security/image-id.txt
      - artifacts/security/image.iid
